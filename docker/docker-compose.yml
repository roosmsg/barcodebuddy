services:
  barcodebuddy:
    # Zelfstandig image, rechtstreeks gebouwd uit de fork github.com/roosmsg/barcodebuddy via docker/Dockerfile.
    # Bijwerken: docker build --pull -t barcodebuddy:docker -f docker/Dockerfile https://github.com/roosmsg/barcodebuddy.git#master
    # en daarna de stack opnieuw uitrollen. Staat buiten Watchtower (lokaal image).
    image: barcodebuddy:docker
    container_name: barcodebuddy
    restart: unless-stopped
    ports:
      - "9284:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:?set TZ in Portainer}"
      ATTACH_BARCODESCANNER: "true"
      BBUDDY_EXTERNAL_GROCY_URL: "${BBUDDY_EXTERNAL_GROCY_URL:?set BBUDDY_EXTERNAL_GROCY_URL in Portainer}"
    volumes:
      - /opt/barcodebuddy/config:/config
    devices:
      - "${BARCODE_SCANNER_DEVICE:?set BARCODE_SCANNER_DEVICE in Portainer}:/dev/input/event0"
